# ═══════════════════════════════════════════════════════════
#  إعدادات Cloudflare Pages
#
#  ⚠ الأسرار مش بتتكتب هنا خالص. الملف ده بيروح على GitHub،
#  والريبو **عام**. مكان الأسرار: لوحة كلاودفلير.
# ═══════════════════════════════════════════════════════════

name = "pos-branch-system"
compatibility_date = "2025-01-15"

# لازم عشان مكتبة supabase-js تشتغل
compatibility_flags = ["nodejs_compat"]

# المجلد اللي فيه الملفات الثابتة. لازم يكون موجود حتى لو شبه فاضي.
pages_build_output_dir = "public"


# ═══════════════════════════════════════════════════════════
#  ⚠ الملف ده هو مصدر الحقيقة
#
#  لما مشروع Pages يكون فيه wrangler.toml، أي متغيّر مكتوب هنا
#  بيظهر في لوحة كلاودفلير **مقفول** — تقدر تشوفه وما تقدرش
#  تعدّله ولا تمسحه.
#
#  ودي مش مشكلة، دي الآلية: اللوحة بتعكس الملف زي المراية.
#  عايز تغيّر قيمة؟ غيّرها هنا. عايز تشيل متغيّر؟ شيله من هنا
#  وهيختفي من اللوحة لوحده.
#
#  ⚠ والأسرار (Secret) استثناء: مش موجودة في الملف، فبتفضل
#  قابلة للتعديل من اللوحة عادي.
# ═══════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════
#  🔴 الإنتاج — والتطوير المحلي
#
#  القسم ده بينطبق على **الإنتاج** (فرع الإنتاج) وعلى التشغيل
#  المحلي. أي فرع تاني بياخد اللي تحت.
# ═══════════════════════════════════════════════════════════

[vars]
# رابط مشروع الإنتاج على سوبابيز.
# مش سرّ — بيبان في أي تطبيق ويب.
SUPABASE_URL = "https://fjhldlitpzekrskrbydu.supabase.co"

# عدد لفّات تجزئة كلمة المرور
PBKDF2_ITERATIONS = "100000"


# ═══════════════════════════════════════════════════════════
#  🔴 المعاينة — بيئة الاستينج
#
#  ══ ده الجدار كله ══
#  أي نشرة من فرع غير فرع الإنتاج بتقرا من هنا بدل اللي فوق.
#  يعني موقع الاستينج بيكلّم قاعدة بيانات تانية تمامًا.
#
#  ⚠ القسم ده **بيستبدل** القسم اللي فوق بالكامل، ما بيضيفش
#  عليه. عشان كده PBKDF2_ITERATIONS مكرّرة هنا — لو شيلتها،
#  بيئة المعاينة هتفضل بلا قيمة.
#
#  ⚠ ولازم تفضل **نفس الرقم**: لو الاستينج بيهرس بعدد لفّات
#  مختلف، كلمات المرور اللي بتتعمل هناك ما بتشتغلش هنا،
#  والاختبار بيقيس حاجة غير اللي بتنشره.
#
#  ⚠⚠ وقبل ما ترفع الملف: بدّل الرابط تحت برابط مشروع
#  الاستينج بتاعك. لو سبته زي ما هو، الاستينج هيكلّم قاعدة
#  الإنتاج — وهيشتغل تمام وما هيقولكش.
#
#  الرابط من: Supabase ← مشروع الاستينج ← Settings ← API
#             ← Project URL
#
#  ⚠⚠ وبلا "/rest/v1/" في آخره.
#
#  ده أشهر غلط في المشروع ومكتوب في توثيقك القديم: مكتبة
#  سوبابيز بتضيف المسار ده بنفسها. لو جه مكتوب، بيبقى عندك
#  ".../rest/v1/rest/v1/" وكل نداء على القاعدة بيفشل — والرسالة
#  ما بتقولكش السبب.
#
#  الصح: https://xxxx.supabase.co
#  الغلط: https://xxxx.supabase.co/rest/v1/
# ═══════════════════════════════════════════════════════════

[env.preview.vars]
SUPABASE_URL = "https://usitjhvgousrycdfqoau.supabase.co"
PBKDF2_ITERATIONS = "100000"


# ═══════════════════════════════════════════════════════════
#  الأسرار — من لوحة كلاودفلير وحدها
#
#  Settings ← Variables and Secrets
#
#    SUPABASE_SERVICE_KEY   ⚠ لازم يختلف بين البيئتين
#    JWT_SECRET
#    REFRESH_TOKEN_PEPPER
#    SETUP_SECRET           في المعاينة وقت التأسيس بس، وبعدين يتمسح
#
#  ⚠ مفتاح الخدمة **مربوط بمشروع سوبابيز بعينه**. مفتاح
#  الإنتاج ما بيفتحش قاعدة الاستينج ولا العكس. فلازم كل بيئة
#  تاخد مفتاحها، وإلا هتلاقي رابط استينج ومفتاح إنتاج =
#  كل نداء على القاعدة بيفشل.
#
#  ⚠ SUPER_ADMIN_PATH و SUPER_ADMIN_ALLOWED_IPS ميّتين —
#  البوّابة السرّية اتلغت والكود مش بيقراهم. امسحهم.
# ═══════════════════════════════════════════════════════════
