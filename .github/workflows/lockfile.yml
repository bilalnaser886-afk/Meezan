# ==========================================================
#  توليد ملف القفل  |  .github/workflows/lockfile.yml
# ----------------------------------------------------------
#  ⚠ ده ملف **لمرة واحدة**. بيتشغّل بإيدك من زرار، مش مع كل
#  رفعة — وبعد ما يخلّص شغله تقدر تمسحه.
#
#  ══ المشكلة اللي بيحلّها ══
#
#  `package.json` فيه "^4.6.20" — والعلامة `^` معناها «ده أو
#  أي إصدار أحدث في نفس العيلة».
#
#  يعني `npm install` بينزّل الأحدث **يوم ما يشتغل**. فالبوّابة
#  ممكن تفحص بمكتبات مختلفة عن اللي كلاودفلير بنت بيها، والاتنين
#  قرو نفس الملف.
#
#  ⚠ ودي أوحش حالة: الاتنين شكلهم صح، والفرق بيبان عند العميل.
#
#  `package-lock.json` بيثبّت الرقم بالظبط — «٤.٦.٢٠ وخلاص».
#  كل بناء بعد كده بيستخدم نفس النسخ بالحرف.
#
#  ══ وليه جيت هب مش كمبيوتر ══
#  الملف ده محتاج `npm` يشتغل مرة واحدة، وإنت شغّال من الموبايل.
#  جيت هب عنده npm — فبنخلّيه يعمله ويرفعه لنفسه.
#
#  ══ ⚠ التمن ══
#  الملف ده بيكتب في الريبو بتاعك (رفعة واحدة). ده مقصود، وهو
#  الحاجة الوحيدة في المشروع اللي بتكتب من غيرك.
#  امسحه بعد ما تخلص عشان ما يفضلش عنده الإذن ده.
# ==========================================================

name: توليد ملف القفل

# ⚠ زرار يدوي بس. مفيش `push` عن قصد — الملف ده ما يصحّش
# يشتغل لوحده مع كل رفعة.
on:
  workflow_dispatch:

# ⚠ الإذن ده هو اللي بيخلّيه يقدر يرفع. من غيره الرفعة بترفض
# برسالة 403، والملف بيتعمل على السيرفر وبيضيع.
permissions:
  contents: write

jobs:
  lockfile:
    name: اعمل package-lock.json وارفعه
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: جِب الكود
        uses: actions/checkout@v4

      - name: ركّب Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # ⚠ مفيش `cache` هنا عن قصد — هو ده الملف اللي الكاش
          # بيدوّر عليه، وهو لسه مش موجود.

      # ---------- موجود خلاص؟ ----------
      # ⚠ من غير الفحص ده، تشغيل الملف تاني بيعمل رفعة فاضية
      # كل مرة — ضجيج في السجل بلا فايدة.
      - name: هو موجود أصلاً؟
        id: check
        run: |
          if [ -f package-lock.json ]; then
            echo "موجود خلاص — مفيش داعي."
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "مش موجود — هنعمله."
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      # ---------- اعمله ----------
      # ⚠ `--package-lock-only` بيحسب النسخ ويكتب الملف **من
      # غير ما ينزّل المكتبات فعليًا**. أسرع بكتير، والناتج هو
      # هو بالظبط.
      - name: اعمل ملف القفل
        if: steps.check.outputs.exists == 'no'
        run: npm install --package-lock-only

      # ---------- تأكّد إنه اتعمل ----------
      # ⚠ من غير الخطوة دي، لو npm فشل بصمت الرفعة اللي بعدها
      # بترفع لا حاجة وبتقول نجاح — نفس الفشل الصامت اللي
      # الفاحص اتعمل عشانه.
      - name: تأكّد إنه اتكتب
        if: steps.check.outputs.exists == 'no'
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::npm ما كتبش الملف."
            exit 1
          fi
          echo "الحجم: $(wc -c < package-lock.json) بايت"
          echo "عدد الحزم المقفولة: $(grep -c '\"resolved\"' package-lock.json || echo 0)"

      # ---------- ارفعه ----------
      - name: ارفعه
        if: steps.check.outputs.exists == 'no'
        run: |
          git config user.name  "meezan-gate"
          git config user.email "gate@meezan.local"
          git add package-lock.json
          git commit -m "أضف package-lock.json — تثبيت نسخ المكتبات"
          git push

      - name: خلاص
        run: |
          echo "لو الملف بان في جذر الريبو، تقدر دلوقتي:"
          echo "  1) تضيف cache: 'npm' في gate.yml"
          echo "  2) تمسح الملف ده"
