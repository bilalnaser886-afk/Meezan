# ==========================================================
#  بوّابة ميزان — فحص قبل النشر
# ----------------------------------------------------------
#  بتشتغل لوحدها على سيرفر جيت هب مع كل رفعة.
#  مش محتاجة كمبيوتر ولا terminal.
#
#  المكان: .github/workflows/gate.yml
#
#  ⚠ نفس الملف لازم يتحط على الفرعين (main و Meazan-staging).
#     جيت هب بيقرا الملف **من الفرع اللي اترفع عليه** — يعني
#     نسخة main مابتحرسش الاستينج. ملف واحد بمحتوى واحد،
#     بس موجود في المكانين.
#
#  ⚠ الفحوصات على مرحلتين بقصد:
#
#    🔴 مانعة  — check-full.js على pages.ts
#       ده الفاحص اللي إنت بتشغّله يدويًا وهو أخضر دلوقتي،
#       فتحميره معناه عطل جديد فعلاً.
#
#    🔴 مانعة كمان — tsc --noEmit + فحص styles.ts
#       دول اتولدوا مُبلّغين عن قصد: أول تشغيلة طلّعت ١٠ أخطاء
#       أنواع قديمة، ولو كانوا مانعين من أول يوم كانت البوّابة
#       هتفضل حمرا وهتتعوّد تتجاهلها — وساعتها بقت زينة مش حارس.
#
#       اتصلّحوا كلهم والعدّاد وصل صفر، فبقوا مانعين.
#
#  ⚠ ومن دلوقتي: أي تحمير معناه عطل **جديد**. متعدّيش عليه.
# ==========================================================

name: بوّابة ميزان

on:
  push:
    branches:
      - main
      - Meazan-staging      # ⚠ لو اسم فرع الاستينج اتغيّر، غيّره هنا
  pull_request:
    branches:
      - main
      - Meazan-staging
  workflow_dispatch:        # زرار تشغيل يدوي من الموبايل

# لو رفعت كذا مرة ورا بعض، الغِ القديم واشتغل على الأحدث
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚠ لو مسارات الملفات عندك مختلفة، غيّر الأسطر دي بس.
  PAGES_FILE: src/ui/pages.ts
  STYLES_FILE: src/ui/styles.ts
  CHECKER: check-full.js

jobs:
  gate:
    name: فحص قبل النشر
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---------- ١) جيب الكود ----------
      - name: جِب الكود
        uses: actions/checkout@v5

      # ---------- ٢) قول بتفحص إيه ----------
      # ⚠ من غير السطر ده، لو شغّالة على الفرعين مش هتعرف
      # الرسالة اللي قدامك بتاعة أنهي فرع.
      - name: الفرع اللي بيتفحص
        run: |
          echo "الفرع : ${{ github.ref_name }}"
          echo "الرفعة: ${{ github.sha }}"

      # ---------- ٢.٥) فيه ملف قفل؟ ----------
      #
      # ══ ⚠ الخطوة دي موجودة عشان الكاش ما يكسرش البوّابة ══
      #
      # `cache: 'npm'` في الخطوة اللي بعديها بيدوّر على
      # package-lock.json. لو ملقاهوش، الخطوة **بتفشل** برسالة
      # "Dependencies lock file is not found" — والبوّابة تحمرّ
      # على كود سليم تمامًا.
      #
      # فبنشوف الأول وبنشغّل الكاش بشرط.
      #
      # ⚠ والقفل مش رفاهية سرعة. من غيره `npm install` بيقرا
      # "^4.6.20" وبينزّل **الأحدث يوم ما يشتغل** — يعني البوّابة
      # ممكن تفحص بمكتبات مختلفة عن اللي كلاودفلير بنت بيها،
      # والاتنين قرو نفس الملف.
      #
      # ⚠ وده أوحش نوع اختلاف: الاتنين شكلهم صح، والفرق بيبان
      # عند العميل. عشان كده الرسالة تحت **تحذير صريح** مش سطر
      # معلومات — الصمت هنا كان هيخلّيك فاكر إن البناء ثابت.
      - name: فيه ملف قفل؟
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "✅ package-lock.json موجود — النسخ مثبّتة والكاش هيشتغل."
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "::warning::package-lock.json مش موجود على الفرع ده."
            echo "⚠ الكاش متوقّف، والبناء بينزّل أحدث نسخة كل مرة."
            echo "⚠ يعني البوّابة ممكن تفحص بمكتبات غير اللي كلاودفلير بنت بيها."
            echo "   شغّل lockfile.yml على الفرع ده."
          fi

      # ---------- ٣) ركّب Node ----------
      #
      # ⚠ نسختين من نفس الخطوة، والاختيار بينهم بـ`if`.
      #
      # السبب إن `cache` مالهاش قيمة معناها "اتجاهلني" — لو
      # حطّيناها فاضية أو بتعبير، الأكشن بيحاول يشتغل ويفشل.
      # الشرط على مستوى الخطوة كلها هو الطريق الوحيد النضيف.
      - name: ركّب Node (بالكاش)
        if: steps.lock.outputs.found == 'yes'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # ⚠ المفتاح هو بصمة package-lock.json نفسه. أول ما
          # تغيّر مكتبة، البصمة تتغيّر وكاش جديد يتعمل —
          # فمستحيل يديك نسخ قديمة.
          cache: 'npm'

      - name: ركّب Node (بلا كاش)
        if: steps.lock.outputs.found != 'yes'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ---------- ٤) الأدوات نفسها موجودة؟ ----------
      # ⚠ من غير الخطوة دي: لو الفاحص اتنقل أو المسار اتغيّر،
      # البوّابة كانت هتعدّي خضرا وهي مش فاحصة حاجة أصلاً.
      # ده نفس الفشل الصامت اللي الفاحص اتعمل عشانه.
      - name: تأكّد إن أدوات الفحص وملفاتها موجودة
        run: |
          missing=0
          for f in package.json tsconfig.json "$CHECKER" "$PAGES_FILE"; do
            if [ ! -f "$f" ]; then
              echo "::error::ناقص: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "البوّابة وقفت — أداة أو ملف فحص ناقص."
            exit 1
          fi
          echo "كل أدوات الفحص موجودة."

      # ---------- ٥) نزّل المكتبات ----------
      #
      # ⚠ `npm ci` بيمسح node_modules ويبني من القفل بالحرف.
      # و`npm install` بيحلّ النطاقات من الأول — فبيتستخدم لما
      # مفيش قفل بس.
      - name: نزّل المكتبات
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ---------- ٦) 🔴 مانع: الفاحص على pages.ts ----------
      # ستّ فحوصات، كل واحد اتولد من عطل حصل فعلاً:
      # backtick في تعليق · شرطة مفردة · متغيّر خارج النطاق ·
      # دالة غير معرّفة · نص أحادي مفتوح · قوس ناقص
      - name: 🔴 الفاحص الخاص — pages.ts
        run: node "$CHECKER" "$PAGES_FILE"

      # ---------- ٧) 🔴 مانع: فحص الأنواع ----------
      #
      # ده بيمسك اللي البناء أعمى عنه: دالة بتستقبل نوع وبتتنادى
      # بنوع تاني، حقل اتشال ولسه متقري، قيمة enum غلط.
      #
      # ══ ⚠ بقى مانع بعد ما العدّاد وصل صفر ══
      # كان مُبلّغ عن قصد لأنه أول مرة يشتغل في حياة المشروع
      # وطلّع ١٠ أخطاء قديمة. اتصلّحوا كلهم، فالتحمير من دلوقتي
      # معناه عطل **جديد** فعلاً.
      #
      # ══ ⚠⚠ وشيل `continue-on-error` لوحده ماكانش بيكفي ══
      # ده أهم تعليق في الملف، اقراه قبل ما تعدّل هنا تاني.
      #
      # الصيغة القديمة كانت:
      #     npx tsc --noEmit 2>&1 | tee tsc.log || true
      #     n=$(grep -c "error TS" tsc.log || true)
      #     echo "عدد أخطاء الأنواع: $n"
      #
      # وفيها **تلات طبقات** بتبلع الفشل:
      #   ١) `|| true` بيحوّل أي فشل لنجاح
      #   ٢) الأنبوب `|` بيرجّع كود `tee` مش كود `tsc`
      #   ٣) آخر أمر `echo` — وهو بينجح دايمًا، وكود الخطوة
      #      هو كود آخر أمر
      #
      # ⚠ يعني شيل السطر كان هيسيب البوّابة خضرا مهما كان الرقم،
      # وإنت فاكرها اتقفلت. الفشل الصامت اللي الفاحص اتعمل عشانه.
      #
      # دلوقتي الرقم بيتفحص صراحةً والخروج بإيدنا.
      - name: 🔴 فحص الأنواع — tsc --noEmit
        run: |
          # ⚠ بنطفي التوقّف التلقائي عشان نمسك الرقم بنفسنا
          # قبل ما الخطوة تقع — من غير كده مش هنطبع العدد.
          set +e
          npx tsc --noEmit 2>&1 | tee tsc.log
          set -e

          n=$(grep -c "error TS" tsc.log || true)
          echo "-----------------------------"
          echo "عدد أخطاء الأنواع: $n"
          echo "-----------------------------"

          if [ "$n" -ne 0 ]; then
            echo "::error::فيه $n خطأ أنواع — البوّابة وقفت."
            exit 1
          fi

      # ---------- ٨) 🟡 مُبلّغ: الفاحص على styles.ts ----------
      # ⚠ ده كان النقطة العميا رقم ٨ في ملف المشروع:
      # «بيفحص pages.ts بس — styles.ts فيه قالب أكبر ومحدش بيفحصه».
      # ⚠ بقى مانع كمان. الفاحص بيخرج بكود ١ لو لقى مشكلة،
      # فالخطوة دي كانت محتاجة شيل السطر وبس — على عكس اللي فوق.
      - name: 🔴 الفاحص الخاص — styles.ts
        run: |
          if [ -f "$STYLES_FILE" ]; then
            node "$CHECKER" "$STYLES_FILE"
          else
            echo "$STYLES_FILE مش موجود — تخطّي."
          fi

      # ---------- ٩) خلاص ----------
      - name: البوّابة عدّت
        run: echo "الفحص المانع خضر — الكود ده آمن للنشر."
